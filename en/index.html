<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rachael Friedlander | Trauma Therapist</title>
  <script>
    (function () {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", new URL("../index.html", location.href), false);
        xhr.send(null);
        var html = xhr.responseText;
        if (!html) return;
        var root = new URL("../", location.href);
        html = html.replace(
          /(\s(?:href|src)=)("|\')(?![a-zA-Z][a-zA-Z0-9+.-]*:|\/\/|#)([^"\']*)\2/g,
          function (_, attr, quote, url) {
            return attr + quote + new URL(url, root).href + quote;
          }
        );
        document.open();
        document.write(html);
        document.close();
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <noscript><p><a href="../">Rachael Friedlander</a></p></noscript>
</body>
</html>
